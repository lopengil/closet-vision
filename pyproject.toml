[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closet-vision"
version = "0.1.0"
description = "Photo of a clothing item -> clean cut-out on a hanger + suggested tags (slot, kind, colours, pattern, material, style)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Manu (lopengil)" }]
dependencies = ["pillow>=10.1", "numpy>=1.24", "rembg[cpu]>=2.0.50"]

[project.optional-dependencies]
tagger = ["torch>=2.1", "transformers>=4.40"]
server = ["flask>=3.0"]
dev = ["pytest>=8", "flask>=3.0"]

[project.scripts]
closet-vision = "closet_vision.__main__:main"

[tool.setuptools.packages.find]
include = ["closet_vision*"]
